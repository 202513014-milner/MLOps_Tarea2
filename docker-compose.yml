# Pipeline completo: PostgreSQL (metadatos de Airflow) + MLflow + Airflow (scheduler y webserver).
#   python scripts/up.py        -> genera .env (commit, imagen), construye y levanta todo
#   Airflow  http://localhost:8080   (admin / admin)      MLflow  http://localhost:5000
# Los CSV NO se incluyen: colócalos en DATA_DIR (por defecto ./data/input).
# Salidas de cada corrida: OUTPUT_DIR (por defecto ./data/output). Funciona con `docker compose up -d` a secas;
# scripts/up.py solo añade commit/imagen exactos al .env.

x-airflow-common: &airflow-common
  image: automl-mlops:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "16"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Misma clave en webserver y scheduler: evita el 403 al leer logs en la UI
    AIRFLOW__WEBSERVER__SECRET_KEY: automl-p3-clave-local
    # Rutas y servicios del pipeline
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    DATA_INPUT_DIR: /data/input
    DATA_OUTPUT_DIR: /data/output
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Trazabilidad: qué código y qué imagen produjeron cada run
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    GIT_BRANCH: ${GIT_BRANCH:-unknown}
    GIT_DIRTY: ${GIT_DIRTY:-unknown}
    DOCKER_IMAGE: automl-mlops:${IMAGE_TAG:-latest}
    DOCKER_IMAGE_ID: ${DOCKER_IMAGE_ID:-unknown}
    # Reintentos y demás parámetros del DAG: config/config.yaml (sección airflow). Descomentar para sobrescribir:
    # AUTOML_RETRIES: "3"
    # Git dentro del contenedor: el repo está montado y pertenece a otro usuario ("dubious ownership").
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /opt/airflow/project
  volumes:
    - ./:/opt/airflow/project
    - ${DATA_DIR:-./data/input}:/data/input:ro
    - ${OUTPUT_DIR:-./data/output}:/data/output
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres: {condition: service_healthy}
    mlflow: {condition: service_healthy}
    init-perms: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: automl-mlflow:3.1.0
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  init-perms:   # el volumen de salidas se crea como root; Airflow corre como UID 50000
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R ${AIRFLOW_UID:-50000}:0 /data/output"]
    volumes: ['${OUTPUT_DIR:-./data/output}:/data/output']

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres: {condition: service_healthy}
      init-perms: {condition: service_completed_successfully}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json,sys; sys.exit(0 if any(u["username"] == "admin" for u in json.load(sys.stdin)) else 1)'; then
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
        fi
        python scripts/configure_pool.py

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      mlflow: {condition: service_healthy}
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      mlflow: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  mlflow:

  airflow_logs:
